services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 12345678
      MYSQL_DATABASE: knitworkshop_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=12345678
      - DB_NAME=knitworkshop_db
      - PORT=8080
      - NODE_ENV=development
      - JWT_SECRET=your_super_secret_jwt_key_here
      - CLOUDINARY_CLOUD_NAME=daieasu6a
      - CLOUDINARY_API_KEY=364246213767626
      - CLOUDINARY_API_SECRET=_jnlLtOJkbHh9aKrz0wi-CI5UkQ
    depends_on:
      - db

volumes:
  db_data:
